<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenderMag Tools Website</title>
    <style>
        /* Basic reset and typography */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }

        /* Navigation Bar */
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 15px;
            font-weight: 500;
        }
        nav a:hover {
            text-decoration: underline;
        }

        /* Hero / Main Content Section */
        .hero {
            max-width: 800px;
            margin: 50px auto;
            padding: 40px 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        .hero h2 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
        }
        .cta-button {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .cta-button:hover {
            background-color: #2980b9;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #2c3e50;
            color: #fff;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Website Header & Navigation -->
    <header>
        <h1>GenderMagTools</h1>
        <nav>
            <a href="#">cognitive-styles-slider</a>
            <a href="#">Other-1</a>
            <a href="#">Other-2</a>
        </nav>
    </header>

    <!-- Main Showcase Content -->
    <main class="hero">
        <h2>GenderMag Tools</h2>
        <p>This is a copy of tools from https://gendermag.org/ 
        Refer to GenderMag Website for details.</p>
        <a href="#" class="cta-button">Get Started</a>
    </main>

    <!-- Website Footer -->
    <footer>
        <p></p>
    </footer>

</body>
</html>
